name: perretxikotan
description: "Perretxikotan - Guía micológica de Euskadi y España y mapa privado de setales con backup en Google Drive."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  archive: ^4.0.2
  image_picker: ^1.1.2
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.2.2
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/mushrooms_catalog.json
    - assets/images/logo_perretxikotan.png
    - assets/images/autumn_forest_bg.png
    - assets/images/mushrooms/
